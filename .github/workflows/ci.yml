name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: Install kubeconform and shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          for app in agents site mcp-tools; do (cd apps/$app && npm ci); done
          tofu -chdir=terraform init -backend=false -input=false
      - name: just check
        run: just check

  # The private denylist never shares a job with installed dependencies or tests. The scanner comes
  # from the default branch, so pull-request code cannot read the secret.
  scrub:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools
          persist-credentials: false
      - name: Scrub check (private denylist)
        working-directory: src
        env:
          SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
        run: python3 ../trusted/tools/scrub_check.py

  ci-success:
    name: ci-success
    runs-on: ubuntu-24.04
    if: always()
    needs: [check, scrub]
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
