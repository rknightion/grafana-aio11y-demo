# Build and publish every image multi-arch to ghcr.io/<owner>/gc-agento11y-<name> (flat
# names: the shared container-publish reusable derives its uploaded artifact name from
# image-name and rejects a "/" in it) through the shared container-publish reusable. Edge builds
# on main; release_tag set for releases.
name: images

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/images.yml"]
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (vX.Y.Z) to publish; empty = edge build"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: agents, context: apps, dockerfile: agents/Dockerfile }
          - { name: site, context: apps, dockerfile: site/Dockerfile }
          # site-browser and dev-workstation carry Playwright's/apt's debian OS packages: every
          # remaining HIGH/CRITICAL there has no fixed version yet (verified against the live
          # Debian bookworm-slim archive, not just the pinned digest) - see images.yml history.
          - { name: site-browser, context: apps, dockerfile: site/Dockerfile.browser, trivy-ignore-unfixed: true }
          - { name: mcp-tools, context: apps, dockerfile: mcp-tools/Dockerfile }
          # gateway is plain debian:bookworm-slim with no application code: every HIGH/CRITICAL is
          # an OS package with no fixed version yet upstream.
          - { name: gateway, context: apps/gateway, dockerfile: Dockerfile, trivy-ignore-unfixed: true }
          - { name: dev-workstation, context: ".", dockerfile: apps/dev-workstation/Dockerfile, trivy-ignore-unfixed: true }
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    # The reusable resolves dockerfile relative to context.
    uses: rknightion/.github/.github/workflows/container-publish.yml@f32275a4a7641f34db5cb005d270db961b54a680 # v1.25.3
    with:
      release-tag: ${{ inputs.release_tag }}
      image-name: gc-agento11y-${{ matrix.name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      # Private until published: no code-scanning upload or attestations on this plan yet.
      trivy-upload-sarif: false
      trivy-ignore-unfixed: ${{ matrix.trivy-ignore-unfixed || false }}
      provenance: false
