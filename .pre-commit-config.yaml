repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^charts/touchline/templates/
      - id: check-json
      - id: detect-private-key
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: scrub-check
        name: scrub-check (private denylist)
        entry: python3 tools/scrub_check.py
        language: system
        pass_filenames: true
      - id: scrub-check-message
        name: scrub-check commit message
        entry: python3 tools/scrub_check.py
        language: system
        stages: [commit-msg]
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -check -recursive
        language: system
        files: \.tf$
        pass_filenames: false
