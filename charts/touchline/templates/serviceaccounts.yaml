# EKS Pod Identity binds this one to the Bedrock IAM role by name (no eks.amazonaws.com/role-arn
# annotation, no IRSA trust policy on the SA). Terraform creates the
# aws_eks_pod_identity_association separately. Only the 5 in-app agent Deployments run as this SA;
# the load generator and the experiments CronJob have their own SAs below with no AWS access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.agents }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "touchline.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# No AWS access and no Kubernetes API access: the load generator only makes HTTP calls to
# SITE_URL.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.loadgen }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "touchline.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# No AWS access. The token stays mounted because the experiments CronJob talks to the Kubernetes
# API directly to take the scheduling Lease (rbac-experiments.yaml scopes that Role to this SA and
# to the one named Lease).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.experiments }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "touchline.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.site }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "touchline.labels" . | nindent 4 }}
# No AWS access: the site never calls Bedrock or any other AWS API directly.
automountServiceAccountToken: false
