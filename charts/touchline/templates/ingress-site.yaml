{{- if .Values.site.ingress }}
{{- $name := printf "%s-site-api" (include "touchline.prefix" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "touchline.labels" . | nindent 4 }}
  {{- with .Values.site.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.site.ingress.className }}
  rules:
    - host: {{ .Values.site.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
