{{- $name := printf "%s-site-api" (include "touchline.prefix" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "touchline.labels" . | nindent 4 }}
    {{- include "touchline.selectorLabels" $name | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "touchline.selectorLabels" $name | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
